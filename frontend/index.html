<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    nav button { font-weight: bold; }
    .panel-title { margin-top: 24px; }
    .shift-actions button { padding: 4px 8px; }
    #shiftMsg { min-height: 1.4em; color: #fcd34d; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav>
      <button id="nav-readings">班测上报</button>
      <button id="nav-shifts">班次窗</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>

    <section id="view-readings" hidden>
      <p id="live">等待推送</p>
      <form id="form">
        <input id="site" placeholder="测点" />
        <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
        <button>上报</button>
      </form>
      <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
    </section>

    <section id="view-shifts" hidden>
      <h2 class="panel-title">班次窗</h2>
      <p id="shiftMsg"></p>
      <form id="openShiftForm">
        <input id="shiftName" placeholder="班次名，如 夜班" />
        <input id="shiftStart" type="datetime-local" step="1" title="起刻" />
        <input id="shiftEnd" type="datetime-local" step="1" title="止刻" />
        <button>开启班次</button>
      </form>
      <h3>班次列表</h3>
      <table>
        <thead><tr><th>名称</th><th>起刻</th><th>止刻</th><th>开启人</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="shiftRows"></tbody>
      </table>
      <h3>大事记</h3>
      <table>
        <thead><tr><th>时刻</th><th>班次</th><th>事项</th><th>操作人</th><th>详情</th></tr></thead>
        <tbody id="eventRows"></tbody>
      </table>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
