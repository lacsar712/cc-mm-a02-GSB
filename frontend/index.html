<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <button id="nav-shifts" hidden>班次窗</button>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <div id="readings-view">
        <p id="live">等待推送</p>
        <form id="form">
          <input id="site" placeholder="测点" />
          <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
          <button>上报</button>
        </form>
        <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div id="shifts-view" hidden>
        <h2>班次窗</h2>
        <p id="shift-msg"></p>
        <div id="shift-open-box" hidden>
          <h3>开启新班次</h3>
          <form id="shift-open-form">
            <input id="shift-name" placeholder="班次名" required />
            <input id="shift-start" type="datetime-local" required />
            <input id="shift-end" type="datetime-local" required />
            <button>开启班次</button>
          </form>
        </div>
        <div id="shift-current-box" hidden>
          <h3>当前开启班次</h3>
          <p id="shift-current"></p>
          <form id="shift-edit-form">
            <input id="edit-start" type="datetime-local" required />
            <input id="edit-end" type="datetime-local" required />
            <button>保存起止</button>
          </form>
          <button id="shift-close">关闭班次</button>
        </div>
        <h3>班次列表</h3>
        <table>
          <thead><tr><th>名称</th><th>开始</th><th>结束</th><th>开启人</th><th>状态</th></tr></thead>
          <tbody id="shift-rows"></tbody>
        </table>
        <h3>大事记</h3>
        <table>
          <thead><tr><th>班次名</th><th>关闭人</th><th>关闭时刻</th></tr></thead>
          <tbody id="event-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
